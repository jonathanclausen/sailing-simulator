name: Physics tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test SailingSimulator.sln -c Release
      - name: Print polar table
        run: dotnet run -c Release --project dotnet/TillerTide.Polar
